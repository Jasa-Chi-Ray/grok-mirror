services:
  grok-mirror:
    image: ${DOCKERHUB_IMAGE:-lisa666520/grok-mirror}:gateway
    ports:
      - "${PORT:-43002}:${PORT:-43002}"
    volumes:
      - ./data:/app/data
    environment:
      HOST: "0.0.0.0"
      PORT: "${PORT:-43002}"
      NO_PROXY: "localhost,127.0.0.1,django,grok-mirror,cfbypass"
      no_proxy: "localhost,127.0.0.1,django,grok-mirror,cfbypass"
      DATABASE_PATH: "/app/data/grok_mirror.db"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      GATEWAY_ADMIN_SECRET: "${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set}"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      MIRROR_API_PREFIX: "${MIRROR_API_PREFIX:-}"
      ALLOW_REGISTER: "${ALLOW_REGISTER:-false}"
      FREE_ACCOUNT_USERNAME: "${FREE_ACCOUNT_USERNAME:-free_account}"
      ADMIN_UPSTREAM: "${ADMIN_UPSTREAM:-}"
      DJANGO_UPSTREAM: "http://django:43003"
      GROK_BASE_URL: "${GROK_BASE_URL:-https://grok.com}"
      GROK_CDN_BASE_URL: "${GROK_CDN_BASE_URL:-https://cdn.grok.com}"
      GROK_ASSETS_BASE_URL: "${GROK_ASSETS_BASE_URL:-https://assets.grok.com}"
      CF_BYPASS_URL: "http://cfbypass:43004"
      CF_BYPASS_PROXY_SERVER: "${CF_BYPASS_PROXY_SERVER:-}"
      REQUEST_TIMEOUT_SECS: "${REQUEST_TIMEOUT_SECS:-180}"
      RUST_LOG: "${RUST_LOG:-info}"
    depends_on:
      django:
        condition: service_healthy
      cfbypass:
        condition: service_started
    restart: unless-stopped
    networks:
      - grok-network

  django:
    image: ${DOCKERHUB_IMAGE:-lisa666520/grok-mirror}:backend
    ports:
      - "127.0.0.1:43003:43003"
    environment:
      DJANGO_ENV: "PRODUCTION"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY must be set}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-django,localhost,127.0.0.1}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      DJANGO_SESSION_COOKIE_SECURE: "${DJANGO_SESSION_COOKIE_SECURE:-true}"
      DJANGO_CSRF_COOKIE_SECURE: "${DJANGO_CSRF_COOKIE_SECURE:-true}"
      SHOW_GITHUB: "${SHOW_GITHUB:-true}"
      NO_PROXY: "localhost,127.0.0.1,django,grok-mirror,cfbypass"
      no_proxy: "localhost,127.0.0.1,django,grok-mirror,cfbypass"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}"
      GATEWAY_ADMIN_SECRET: "${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set}"
      CREDENTIAL_ENCRYPTION_KEY: "${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set}"
      API_TOKEN_TTL_SECONDS: "${API_TOKEN_TTL_SECONDS:-604800}"
      ALLOW_REGISTER: "${ALLOW_REGISTER:-false}"
      FREE_ACCOUNT_USERNAME: "${FREE_ACCOUNT_USERNAME:-free_account}"
      GROK_GATEWAY_URL: "http://grok-mirror:${PORT:-43002}"
      CLOUDFLARE_TURNSTILE: "${CLOUDFLARE_TURNSTILE:-disable}"
      CLOUDFLARE_TURNSTILE_SITE_KEY: "${CLOUDFLARE_TURNSTILE_SITE_KEY:-}"
      CLOUDFLARE_TURNSTILE_SECRET_KEY: "${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-3}"
      GUNICORN_THREADS: "${GUNICORN_THREADS:-2}"
    volumes:
      - ./backend/logs:/app/backend/logs
      - ./backend/db:/app/backend/db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:43003/0x/user/version-cfg', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    networks:
      - grok-network

  cfbypass:
    image: ${DOCKERHUB_IMAGE:-lisa666520/grok-mirror}:cfbypass
    command:
      - uvicorn
      - app:app
      - --host
      - "0.0.0.0"
      - --port
      - "43004"
    ports:
      - "127.0.0.1:43004:43004"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      CF_BYPASS_HEADLESS: "${CF_BYPASS_HEADLESS:-true}"
      CF_BYPASS_MAX_WAIT_SECONDS: "${CF_BYPASS_MAX_WAIT_SECONDS:-35}"
      CF_BYPASS_PARTIAL_COOKIE_GRACE_SECONDS: "${CF_BYPASS_PARTIAL_COOKIE_GRACE_SECONDS:-8}"
      CF_BYPASS_NAVIGATION_RETRIES: "${CF_BYPASS_NAVIGATION_RETRIES:-2}"
      CF_BYPASS_SECRET: "${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set}"
      CF_BYPASS_ALLOWED_HOSTS: "${CF_BYPASS_ALLOWED_HOSTS:-grok.com,.grok.com}"
    shm_size: "1gb"
    restart: unless-stopped
    networks:
      - grok-network

networks:
  grok-network:
    driver: bridge
